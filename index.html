<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Chat Privé">
    <title>Mon Chat Privé</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="chat-container">

        <!-- EN-TÊTE -->
        <header class="chat-header">
            <div class="user-info" id="partnerInfo" title="Voir le profil">
                <img id="partnerAvatar" class="chat-avatar" alt="Photo de profil">
                <div>
                    <h3 id="partnerName">Mon Amour</h3>
                    <span class="status offline" id="statusText">○ Hors ligne</span>
                </div>
            </div>
            <button type="button" class="me-btn" id="meBtn" title="Mon profil">
                <img id="meAvatar" class="me-avatar" alt="Mon profil">
            </button>
        </header>

        <!-- BANDEAU HORS LIGNE -->
        <div class="offline-banner" id="offlineBanner">📴 Hors ligne — tes messages partiront dès que la connexion reviendra</div>

        <!-- ZONE DE DISCUSSION -->
        <main class="chat-messages" id="chatMessages"></main>

        <!-- INDICATEUR D'ACTIVITÉ + VISUALISEUR AUDIO AVEC BOUTON ANNULER -->
        <div class="activity-bar" id="activityBar">
            <button type="button" id="cancelRecBtn" class="cancel-rec-btn" title="Annuler l'enregistrement">🗑️</button>
            <canvas id="audioVisualizer" width="180" height="30"></canvas>
            <span id="recordingTimer" class="recording-timer">00:00</span>
        </div>

        <!-- PANNEAU EMOJIS -->
        <div class="emoji-picker" id="emojiPicker">
            <span>❤️</span><span>😍</span><span>😂</span><span>🔥</span><span>🥰</span><span>✨</span><span>👍</span><span>🎉</span><span>😘</span><span>🙏</span><span>😢</span><span>🤗</span>
        </div>

        <!-- BARRE DE SAISIE -->
        <footer class="chat-input-area">
            <button type="button" class="action-btn" id="emojiToggleBtn">😊</button>

            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <button type="button" class="action-btn" id="imageBtn">📷</button>

            <input type="text" id="messageInput" placeholder="Écris ton message..." autocomplete="off" enterkeyhint="send">

            <button type="button" class="action-btn mic-btn" id="recordBtn">🎙️</button>
            <button type="button" id="sendBtn">Envoyer</button>
        </footer>

    </div>

    <!-- MODALE APERÇU IMAGE -->
    <div class="image-modal" id="imageModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img id="modalImg" src="" alt="Aperçu">
    </div>

    <!-- FENÊTRE : MON PROFIL (modifiable) -->
    <div class="profile-modal" id="profileModal">
        <div class="profile-card">
            <button type="button" class="profile-close" id="profileClose" title="Fermer">&times;</button>
            <h2>Mon profil</h2>

            <div class="profile-avatar-wrap">
                <img id="profileAvatarPreview" class="profile-avatar-big" alt="Ma photo">
                <button type="button" class="profile-avatar-edit" id="profileAvatarBtn" title="Changer la photo">📷</button>
            </div>
            <input type="file" id="profileAvatarInput" accept="image/*" style="display: none;">
            <button type="button" class="link-btn" id="profileRemoveBtn">Retirer la photo</button>

            <label class="profile-field">Nom affiché
                <input type="text" id="profileNameInput" maxlength="30" placeholder="Ton nom" autocomplete="off">
            </label>
            <label class="profile-field">Statut
                <textarea id="profileBioInput" maxlength="80" rows="2" placeholder="Ex : Disponible, en réunion, au travail…"></textarea>
            </label>

            <button type="button" class="profile-save" id="profileSaveBtn">Enregistrer</button>
            <button type="button" class="profile-signout" id="profileSignOutBtn">Se déconnecter</button>
        </div>
    </div>

    <!-- FENÊTRE : PROFIL DE L'AUTRE PERSONNE (lecture seule) -->
    <div class="profile-modal" id="partnerModal">
        <div class="profile-card">
            <button type="button" class="profile-close" id="partnerModalClose" title="Fermer">&times;</button>
            <div class="profile-avatar-wrap">
                <img id="partnerModalAvatar" class="profile-avatar-big" alt="Photo de profil">
            </div>
            <h2 id="partnerModalName"></h2>
            <p class="profile-bio" id="partnerModalBio"></p>
        </div>
    </div>

    <!-- ÉCRAN DE CONNEXION : recouvre tout tant que personne n'est identifié -->
    <div class="login-screen" id="loginScreen">
        <form class="login-card" id="loginForm" autocomplete="on">
            <div class="login-mark">💬</div>
            <h1>Mon Chat Privé</h1>
            <p class="login-intro">Connecte-toi pour accéder à votre conversation.</p>

            <p class="login-error" id="loginError"></p>

            <label class="login-field">Adresse e-mail
                <input type="email" id="loginEmail" name="email" autocomplete="username" required>
            </label>
            <label class="login-field">Mot de passe
                <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
            </label>

            <button type="submit" id="loginSubmit">Se connecter</button>
        </form>
    </div>

    <!-- SCRIPTS : Supabase, puis l'authentification, puis le chat -->
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="chat.js"></script>
</body>
</html>
